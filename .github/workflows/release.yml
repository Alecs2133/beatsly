name: Build Installers

on:
  workflow_dispatch: # Rulare manuală din interfața GitHub
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Release-ul se numește după versiunea din package.json, nu după tag. Un
      # tag `v0.2.0` pe un commit cu versiunea 0.1.9 ar suprascrie release-ul
      # 0.1.9 — oprim build-ul înainte de asta.
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} nu se potrivește cu versiunea din package.json (${version}). Folosește 'npm run release'."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Semnarea artefactelor pentru auto-update. Fără aceste două secrete
          # nu se generează `latest.json`, iar actualizarea automată nu merge:
          # clientul refuză orice pachet nesemnat.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # `__VERSION__` este înlocuit de tauri-action cu versiunea aplicației,
          # citită din tauri.conf.json (care la rândul lui o ia din
          # package.json). Anterior tag-ul era fix `v0.1.0-beta`, deci fiecare
          # build suprascria același release.
          tagName: v__VERSION__
          releaseName: 'Beats.ly v__VERSION__'
          releaseBody: 'Download the installer for your operating system below.'
          # Draft până termină TOATE platformele; jobul `publish` de mai jos îl
          # publică doar dacă ambele build-uri au reușit, ca updater-ul să nu
          # servească un latest.json cu o singură platformă.
          releaseDraft: true
          # NU prerelease: updater-ul citește `/releases/latest/download/...`,
          # iar GitHub exclude pre-release-urile din `latest` — cu `true`,
          # endpoint-ul rămânea blocat pe v0.1.0-beta și nimeni nu primea
          # vreodată un update.
          prerelease: false
          # Generează și atașează `latest.json`, pe care îl consumă updater-ul.
          includeUpdaterJson: true

  publish:
    name: Publish release
    needs: build-tauri
    # Doar pentru tag-uri; o rulare manuală (workflow_dispatch) rămâne draft.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Verifică producția după publicare (DB, funcții, site, latest.json).
      # Scriptul folosește doar module Node built-in, deci nu e nevoie de npm ci.
      - name: Smoke test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/smoke.mjs
