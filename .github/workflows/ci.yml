name: CI

# Prinde erorile de tip/build înainte să ajungă într-un release. Rulează la
# fiecare push pe main și pe fiecare PR; build-urile de installer rămân în
# release.yml (doar pe tag-uri).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Desktop app (tsc + vite + cargo check)
    # Windows: platforma principală. Linux are jobul `app-linux` de mai jos.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `tsc && vite build`. Produce și `dist/`, de care `generate_context!`
      # din Rust are nevoie la compilare.
      - run: npm run build

      - run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: cargo check
        run: cargo check --locked
        working-directory: src-tauri

  app-linux:
    name: Desktop app (cargo check pe Linux)
    # Pe Linux se compilează alt cod: webview-ul e WebKitGTK, iar „trage în
    # DAW” are o implementare GTK separată. Fără jobul ăsta, o eroare de
    # compilare pe Linux ar ieși la iveală abia la build-ul de release.
    # Aceeași versiune ca în release.yml, ca să prindem aceleași probleme.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `generate_context!` din Rust are nevoie de `dist/` ca să compileze.
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: cargo check
        run: cargo check --locked
        working-directory: src-tauri

  functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `none`: altfel Deno caută pachetele npm în node_modules-ul aplicației
      # (package.json din rădăcină), unde Stripe nu există.
      - run: deno check --node-modules-dir=none --no-lock supabase/functions/*/index.ts

  website:
    name: Website (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
