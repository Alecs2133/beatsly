<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e0e1a;stop-opacity:1" />
    </linearGradient>

    <!-- Purple glow blob top-left -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#050508;stop-opacity:0" />
    </radialGradient>

    <!-- Cyan glow blob bottom-right -->
    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#00bbf9;stop-opacity:0.14" />
      <stop offset="100%" style="stop-color:#050508;stop-opacity:0" />
    </radialGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9d4edd" />
      <stop offset="50%" style="stop-color:#00bbf9" />
      <stop offset="100%" style="stop-color:#f15bb5" />
    </linearGradient>

    <!-- Pill gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9d4edd" />
      <stop offset="100%" style="stop-color:#00bbf9" />
    </linearGradient>

    <!-- Waveform bar gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#00bbf9;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowLeft)" />
  <rect width="1200" height="630" fill="url(#glowRight)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Waveform decoration (bottom) -->
  <g transform="translate(0, 490)" opacity="0.35">
    <!-- bars at various heights to simulate a waveform -->
    <rect x="60"   y="0"  width="6" height="60"  rx="3" fill="url(#waveGrad)" />
    <rect x="76"   y="15" width="6" height="45"  rx="3" fill="url(#waveGrad)" />
    <rect x="92"   y="5"  width="6" height="80"  rx="3" fill="url(#waveGrad)" />
    <rect x="108"  y="20" width="6" height="40"  rx="3" fill="url(#waveGrad)" />
    <rect x="124"  y="0"  width="6" height="90"  rx="3" fill="url(#waveGrad)" />
    <rect x="140"  y="10" width="6" height="70"  rx="3" fill="url(#waveGrad)" />
    <rect x="156"  y="25" width="6" height="50"  rx="3" fill="url(#waveGrad)" />
    <rect x="172"  y="5"  width="6" height="75"  rx="3" fill="url(#waveGrad)" />
    <rect x="188"  y="30" width="6" height="35"  rx="3" fill="url(#waveGrad)" />
    <rect x="204"  y="0"  width="6" height="95"  rx="3" fill="url(#waveGrad)" />
    <rect x="220"  y="15" width="6" height="60"  rx="3" fill="url(#waveGrad)" />
    <rect x="236"  y="8"  width="6" height="72"  rx="3" fill="url(#waveGrad)" />
    <rect x="252"  y="20" width="6" height="55"  rx="3" fill="url(#waveGrad)" />
    <rect x="268"  y="0"  width="6" height="88"  rx="3" fill="url(#waveGrad)" />
    <rect x="284"  y="12" width="6" height="65"  rx="3" fill="url(#waveGrad)" />

    <rect x="900"  y="10" width="6" height="65"  rx="3" fill="url(#waveGrad)" />
    <rect x="916"  y="0"  width="6" height="90"  rx="3" fill="url(#waveGrad)" />
    <rect x="932"  y="20" width="6" height="50"  rx="3" fill="url(#waveGrad)" />
    <rect x="948"  y="5"  width="6" height="80"  rx="3" fill="url(#waveGrad)" />
    <rect x="964"  y="30" width="6" height="40"  rx="3" fill="url(#waveGrad)" />
    <rect x="980"  y="0"  width="6" height="95"  rx="3" fill="url(#waveGrad)" />
    <rect x="996"  y="15" width="6" height="60"  rx="3" fill="url(#waveGrad)" />
    <rect x="1012" y="8"  width="6" height="75"  rx="3" fill="url(#waveGrad)" />
    <rect x="1028" y="25" width="6" height="45"  rx="3" fill="url(#waveGrad)" />
    <rect x="1044" y="0"  width="6" height="85"  rx="3" fill="url(#waveGrad)" />
    <rect x="1060" y="18" width="6" height="55"  rx="3" fill="url(#waveGrad)" />
    <rect x="1076" y="5"  width="6" height="70"  rx="3" fill="url(#waveGrad)" />
    <rect x="1092" y="22" width="6" height="48"  rx="3" fill="url(#waveGrad)" />
    <rect x="1108" y="0"  width="6" height="92"  rx="3" fill="url(#waveGrad)" />
    <rect x="1124" y="12" width="6" height="63"  rx="3" fill="url(#waveGrad)" />
  </g>

  <!-- Center pill badge -->
  <rect x="482" y="178" width="236" height="36" rx="18" fill="url(#pillGrad)" opacity="0.15" />
  <rect x="482" y="178" width="236" height="36" rx="18" fill="none" stroke="url(#pillGrad)" stroke-width="1" opacity="0.6" />
  <text x="600" y="202" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#00bbf9" opacity="0.9">SOUND LIBRARY FOR PRODUCERS</text>

  <!-- Main title: beats.ly -->
  <text x="600" y="310" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="110" font-weight="800" letter-spacing="-3" fill="url(#titleGrad)">beats.ly</text>

  <!-- Tagline -->
  <text x="600" y="368" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#a0a0b5" letter-spacing="0.5">Discover · Download · Create</text>

  <!-- Bottom feature pills -->
  <g transform="translate(600, 430)">
    <!-- Loops pill -->
    <rect x="-280" y="0" width="110" height="32" rx="16" fill="rgba(157,78,221,0.12)" stroke="rgba(157,78,221,0.4)" stroke-width="1" />
    <text x="-225" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#9d4edd">Loops</text>

    <!-- One-Shots pill -->
    <rect x="-150" y="0" width="130" height="32" rx="16" fill="rgba(0,187,249,0.1)" stroke="rgba(0,187,249,0.35)" stroke-width="1" />
    <text x="-85" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#00bbf9">One-Shots</text>

    <!-- FX pill -->
    <rect x="-0" y="0" width="80" height="32" rx="16" fill="rgba(241,91,181,0.1)" stroke="rgba(241,91,181,0.35)" stroke-width="1" />
    <text x="40" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#f15bb5">FX</text>

    <!-- AI Generated pill -->
    <rect x="100" y="0" width="150" height="32" rx="16" fill="rgba(157,78,221,0.12)" stroke="rgba(157,78,221,0.4)" stroke-width="1" />
    <text x="175" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#9d4edd">AI Generated</text>
  </g>
</svg>
