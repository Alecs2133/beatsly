[package]
name = "beatsly"
# Versiunea aplicației livrate vine din package.json, prin tauri.conf.json.
# Aceasta e doar versiunea crate-ului și nu apare în installer.
version = "0.1.5"
description = "Sample library and sound manager for producers"
authors = ["Beats.ly"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21.1"
regex = "1"
tauri-plugin-dialog = "2.0.0"
# Necesar pentru writeFile la download. Era tras doar tranzitiv prin
# tauri-plugin-dialog și nu era înregistrat, deci descărcările eșuau.
tauri-plugin-fs = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-http = "2"

# reqwest / tokio / dotenvy au fost eliminate odată cu comanda
# generate_audio_backend: aceea primea tokenul HuggingFace de la frontend,
# iar generarea s-a mutat în edge function-ul Supabase.
# tauri-plugin-opener era declarat dar niciodată înregistrat în main.rs.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
